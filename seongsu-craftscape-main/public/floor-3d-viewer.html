<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>성수동 2가 309-126 층별 용도 360 Viewer</title>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #fcedd3; font-family: 'Noto Serif KR', serif; }
    #tester { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="tester"></div>
  <script>
    var data = [];

    function add_box(x, y, z, w, h, d, color, name, opacity=0.8) {
      data.push({
        type: 'mesh3d',
        x: [x, x+w, x+w, x, x, x+w, x+w, x],
        y: [y, y, y+h, y+h, y, y, y+h, y+h],
        z: [z, z, z, z, z+d, z+d, z+d, z+d],
        alphahull: 0,
        color: color,
        opacity: opacity,
        name: name,
        showlegend: true
      });
    }

    function add_floor(z, color, name, size=6) {
      add_box(0, 0, z, size, size, 0.25, color, name, 0.55);
    }

    function add_person(x, y, z) {
      data.push({
        type: 'scatter3d',
        mode: 'markers',
        x: [x], y: [y], z: [z],
        marker: { size: 10, color: '#333333' },
        name: '사람',
        showlegend: true
      });
    }

    add_floor(0, "crimson", "1층 빈티지샵");
    add_floor(1.5, "hotpink", "2층 자동차 정비소");
    add_floor(3, "deeppink", "3층 수제화");
    add_floor(4.5, "gold", "4층 주택");

    var people = [
        [1,1,0.4],
        [3,2,1.9],
        [2,4,3.4],
        [4,3,5]
    ];
    for (var i=0; i<people.length; i++) {
        data.push({
            type: 'scatter3d',
            mode: 'markers',
            x: [people[i][0]],
            y: [people[i][1]],
            z: [people[i][2]],
            marker: { size: 8, color: '#000000' },
            name: "활동 인구",
            showlegend: i === 0
        });
    }

    // 1층
    add_box(1,1,0.3,2,0.4,1,"brown","옷 진열대");
    add_box(3,3,0.3,1,1,0.3,"saddlebrown","판매 테이블");
    add_person(2,2,0.9);

    // 2층
    add_box(2,2,1.8,2,1,0.5,"gray","자동차");
    add_box(4,1,1.8,1,0.5,1,"black","정비대");
    add_person(3,3,2.5);

    // 3층
    add_box(1,2,3.3,2,0.5,1,"white","작업대");
    add_person(2,3,4.0);

    // 4층
    add_box(2,2,4.8,2,1,0.4,"white","식탁");
    add_box(4,4,4.8,1,1,0.3,"gray","소파");
    add_person(3,3,5.5);

    var layout = {
      title: false,
      scene: {
        aspectmode: "manual",
        aspectratio: { x: 0.75, y: 1, z: 1.3 },
        camera: {
          eye: { x: 1.8, y: 1.8, z: 1.5 }
        },
        xaxis: { showgrid: false, zeroline: false, showline: false, showticklabels: false, title: "" },
        yaxis: { showgrid: false, zeroline: false, showline: false, showticklabels: false, title: "" },
        zaxis: { showgrid: false, zeroline: false, showline: false, showticklabels: false, title: "" },
        bgcolor: '#fcedd3'
      },
      paper_bgcolor: '#fcedd3',
      plot_bgcolor: '#fcedd3',
      margin: { l: 0, r: 0, b: 0, t: 0 },
      showlegend: true,
      legend: {
        x: 0, y: 1,
        font: { color: '#131e3d' },
        bgcolor: 'rgba(252,237,211,0.5)'
      }
    };

    var config = {
      responsive: true,
      displayModeBar: false
    };

    Plotly.newPlot('tester', data, layout, config);
  </script>
</body>
</html>
