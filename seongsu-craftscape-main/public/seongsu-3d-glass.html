        // -------------------------------------------------------------

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#eaeaea');

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 20, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 조명 세팅
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 0.85);
        dirLight.position.set(40, 50, 30);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 성수동 위성 지도 기반 실제 외벽 색상 재질
        // 터콰이즈/청록: 공장·산업 지붕 (가장 지배적)
        const tealRoof = new THREE.MeshStandardMaterial({ color: 0x4a9e96, roughness: 0.55, metalness: 0.1 });
        // 짙은 청록: 오래된 공장 지붕
        const darkTeal = new THREE.MeshStandardMaterial({ color: 0x2e7b74, roughness: 0.65 });
        // 베이지/크림: 주거·근린생활 건물 외벽
        const beige = new THREE.MeshStandardMaterial({ color: 0xd4c5a2, roughness: 0.80 });
        // 연한 베이지: 신축·밝은 외벽
        const lightBeige = new THREE.MeshStandardMaterial({ color: 0xe8dfc8, roughness: 0.75 });
        // 황토/주황 베이지: 오래된 적벽돌 건물
        const warmBrick = new THREE.MeshStandardMaterial({ color: 0xc4935a, roughness: 0.82 });
        // 중간 회색: 콘크리트 건물
        const concrete = new THREE.MeshStandardMaterial({ color: 0xa0a09a, roughness: 0.78 });
        // 밝은 회색: 신축 콘크리트·타일
        const lightConcrete = new THREE.MeshStandardMaterial({ color: 0xc8c8c0, roughness: 0.70 });
        
        // 지식산업센터(고층) 유리 외벽: 주변 환경맵이 없을 때 검게 보이는 현상을 막기 위해 밝은 청색으로 수정
        const glassFacade = new THREE.MeshStandardMaterial({ 
            color: 0x4aa3df,        // 맑고 밝은 푸른색 (Blue)
            metalness: 0.2,         // 금속성을 낮춰 검게 반사되는 현상 방지
            roughness: 0.1,         // 유리처럼 매끄러운 표면
            transparent: true, 
            opacity: 0.75,          // 시원한 반투명
            side: THREE.DoubleSide
        });

        // 도로
        const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x4a4a48, roughness: 0.92 });

        // OBJLoader의 parse 기능을 이용해 텍스트 데이터를 직접 3D로 변환
        const loader = new THREE.OBJLoader();
        const obj = loader.parse(objText);
        
        // 위성 지도 기반 자동 채색 — 높이+난수 조합으로 다양한 팔레트 구현
        let meshIndex = 0;
        obj.traverse(function (child) {
            if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;

                const boundingBox = new THREE.Box3().setFromObject(child);
                const height = boundingBox.max.y - boundingBox.min.y;
                const minY = boundingBox.min.y;

                if (minY < 0.05 && height < 0.5) {
                    // 바닥/도로
                    child.material = roadMaterial;
                } else if (height > 10.0) {
                    // 고층 건물 → 유리 외벽
                    child.material = glassFacade;
                } else if (height > 5.5) {
                    // 중고층 → 터콰이즈 or 베이지 (산업/주거 혼재)
                    const palette = [tealRoof, darkTeal, beige, warmBrick];
                    child.material = palette[meshIndex % palette.length];
                } else if (height > 2.5) {
                    // 중저층 → 가장 다양한 팔레트 (성수동 특징: 혼재)
                    const palette = [tealRoof, beige, lightBeige, warmBrick, concrete, darkTeal, lightConcrete];
                    child.material = palette[meshIndex % palette.length];
                } else {
                    // 저층/단층 → 베이지·콘크리트 위주
                    const palette = [lightBeige, concrete, beige, lightConcrete];
                    child.material = palette[meshIndex % palette.length];
                }
                meshIndex++;
            }
        });


        // 중심 정렬 및 씬 추가
        const box = new THREE.Box3().setFromObject(obj);
        const center = box.getCenter(new THREE.Vector3());
        obj.position.sub(center);
        scene.add(obj);

        // 애니메이션
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
