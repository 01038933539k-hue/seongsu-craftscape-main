<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성수동 3D 뷰어</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
    model-viewer { width: 100%; height: 100%; background-color: ochre; position: relative; }

.legend-container {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #c8c8c8;
      border-radius: 6px;
      padding: 12px 14px;
      z-index: 999;
    }
    .legend-title {
      font-size: 12px;
      font-weight: bold;
      color: #015185;
      margin-bottom: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
      font-size: 11px;
      color: #555;
    }

    .legend-item:last-child {
      margin-bottom: 0;
    }

    .color-box {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      margin-right: 6px;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
</head>
<body>
  <model-viewer 
    src="/seongsu3.glb"
    alt="성수동 3D 모델"
    camera-controls
    camera-orbit="10deg 60deg 5m">



    

  </model-viewer>

</body>
</html>
